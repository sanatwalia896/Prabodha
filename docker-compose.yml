services:
  focus-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: focus_db
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - focus-network

  focus-media:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/media && tail -f /dev/null"]
    volumes:
      - ./data/media:/data/media
    networks:
      - focus-network

networks:
  focus-network:
    driver: bridge
